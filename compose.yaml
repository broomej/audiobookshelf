services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "${TAILNET_IP}:${ABS_PORT}:80"
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ${ABS_CONFIG}:/config
      - ${ABS_DATA}/metadata:/metadata
      - ${ABS_DATA}/podcasts:/podcasts
      - ${ABS_DATA}/audiobooks:/audiobooks
      - /etc/localtime:/etc/localtime:ro
